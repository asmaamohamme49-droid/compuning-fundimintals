<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computing Fundamentals - منصة المذاكرة</title>
    <style>
        :root {
            --bg: #f8f6f0; --surface: #ffffff; --surface-2: #f0ede5; --text: #1a2b3c;
            --muted: #667085; --line: #e2ddd3; --navy: #1b3a57; --navy-hover: #12293f;
            --green: #2e7d5b; --green-soft: #e8f5ee; --red: #c0392b; --red-soft: #fce8e6;
            --shadow: 0 4px 20px rgba(27, 58, 87, 0.06); --radius: 16px; --transition: 0.3s ease;
        }
        [data-theme="dark"] {
            --bg: #0f1722; --surface: #1a2533; --surface-2: #243446; --text: #e2e8f0;
            --muted: #94a3b8; --line: #2d4056; --navy: #8ab4f8; --navy-hover: #aecbfa;
            --green: #34d399; --green-soft: #064e3b; --red: #f87171; --red-soft: #7f1d1d;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg); color: var(--text); transition: background var(--transition), color var(--transition); line-height: 1.6; }
        
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 100; }
        .brand { font-weight: 700; font-size: 1.2rem; color: var(--navy); }
        .brand-sub { font-size: 0.8rem; color: var(--muted); }
        .icon-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text); padding: 0.5rem; border-radius: 8px; }
        .icon-btn:hover { background: var(--surface-2); }
        .menu-btn { display: none; }

        .layout { display: flex; min-height: calc(100vh - 70px); }
        .sidebar { width: 280px; background: var(--surface); border-left: 1px solid var(--line); padding: 1.5rem 1rem; flex-shrink: 0; height: calc(100vh - 70px); overflow-y: auto; position: sticky; top: 70px; transition: transform var(--transition); }
        .sidebar-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-weight: bold; color: var(--muted); }
        .sidebar-head .icon-btn { display: none; }
        .nav-home { width: 100%; text-align: right; padding: 0.75rem 1rem; background: var(--navy); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 1rem; }
        .nav-chapter { width: 100%; display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; background: transparent; border: 1px solid transparent; border-radius: 8px; cursor: pointer; text-align: right; color: var(--text); margin-bottom: 0.5rem; }
        .nav-chapter:hover, .nav-chapter.active { background: var(--surface-2); border-color: var(--line); }
        .nav-num { background: var(--navy); color: white; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 0.8rem; flex-shrink: 0; }
        .nav-title { font-size: 0.9rem; font-weight: 600; display: block; }
        .nav-progress { font-size: 0.75rem; color: var(--green); }

        .main-content { flex-grow: 1; padding: 2rem; max-width: 1000px; margin: 0 auto; }
        .card { background: var(--surface); border-radius: var(--radius); padding: 1.5rem; box-shadow: var(--shadow); border: 1px solid var(--line); margin-bottom: 1.5rem; }
        .btn { padding: 0.6rem 1.2rem; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.95rem; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: var(--navy); color: white; }
        .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
        .btn-success { background: var(--green); color: white; }
        .btn-danger { background: var(--red); color: white; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { text-align: center; }
        .stat-card span { color: var(--muted); font-size: 0.9rem; }
        .stat-card strong { display: block; font-size: 1.8rem; color: var(--navy); }
        .chapter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .chapter-card { cursor: pointer; transition: transform var(--transition); display: flex; flex-direction: column; }
        .chapter-card:hover { transform: translateY(-4px); }
        .chapter-card h3 { margin-bottom: 0.5rem; color: var(--navy); }
        .chapter-card p { color: var(--muted); font-size: 0.9rem; flex-grow: 1; margin-bottom: 1rem; }
        .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .badge-idle { background: var(--surface-2); color: var(--muted); }
        .badge-done { background: var(--green-soft); color: var(--green); }

        .stepper { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .step { padding: 0.5rem 1rem; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); cursor: pointer; font-weight: 600; color: var(--muted); }
        .step.active { background: var(--navy); color: white; border-color: var(--navy); }

        .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
        .english-text { font-family: monospace; color: var(--navy); line-height: 1.8; margin-bottom: 0.5rem; }
        .arabic-text { color: var(--text); margin-bottom: 0.5rem; }
        .term-list { list-style: none; }
        .term-list li { margin-bottom: 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px dashed var(--line); }

        .question-box { background: var(--surface); padding: 1.5rem; border-radius: var(--radius); border: 1px solid var(--line); margin-bottom: 1rem; }
        .question-box.correct { border-right: 4px solid var(--green); }
        .question-box.wrong { border-right: 4px solid var(--red); }
        .q-title { font-weight: bold; margin-bottom: 1rem; display: block; }
        .options-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .option-label { display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
        .option-label:hover { background: var(--surface-2); }
        .option-label.selected { border-color: var(--navy); background: var(--surface-2); }

        .flashcard-container { perspective: 1000px; margin: 2rem 0; }
        .flashcard { background: var(--surface); border-radius: var(--radius); padding: 3rem 2rem; text-align: center; box-shadow: var(--shadow); border: 1px solid var(--line); min-height: 250px; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; }
        .flashcard h3 { font-size: 1.2rem; color: var(--navy); }
        .flashcard .answer { display: none; font-size: 1.1rem; color: var(--text); line-height: 1.8; }
        .flashcard.revealed .answer { display: block; }
        .flashcard.revealed h3 { display: none; }

        @media (max-width: 768px) {
            .menu-btn { display: block; }
            .sidebar { position: fixed; top: 0; right: -100%; width: 280px; height: 100vh; z-index: 1000; background: var(--surface); }
            .sidebar.open { transform: translateX(-100%); }
            .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; }
            .sidebar-overlay.open { display: block; }
            .sidebar-head .icon-btn { display: block; }
            .main-content { padding: 1rem; }
            .content-grid { grid-template-columns: 1fr; }
            .stepper { flex-direction: column; }
        }
    </style>
</head>

        // =========================================================================
        // 2. إدارة الحالة (State Management)

        const STORAGE_KEY = "computing_progress_v3";
        let state = {
            theme: "light",
            currentChapterId: null,
            currentView: "dashboard",
            currentStage: "study",
            currentSectionIndex: 0,
            progress: {}
        };

        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) state = { ...state, ...JSON.parse(saved) };
            } catch (e) { console.warn("Storage disabled."); }
            document.documentElement.setAttribute("data-theme", state.theme || "light");
            document.querySelector('.theme-btn').innerText = state.theme === 'light' ? '🌙' : '☀️';
        }

        function saveState() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
        }

        function getProgress(chapterId) {
            if (!state.progress[chapterId]) {
                state.progress[chapterId] = {
                    studiedSections: [],
                    flashcardsKnown: [],
                    finalScore: null
                };
            }
            return state.progress[chapterId];
        }

        function calcPercent(ch) {
            if (!ch.sections || ch.sections.length === 0) return 0;
            const p = getProgress(ch.id);
            let total = ch.sections.length + ch.flashcards.length + 1;
            let done = p.studiedSections.length + p.flashcardsKnown.length + (p.finalScore !== null ? 1 : 0);
            return Math.round((done / total) * 100);
        }

        // 3. الريندر (Rendering)
        // =========================================================================
        const mainContent = document.getElementById("mainContent");
        const sidebarChapters = document.getElementById("sidebarChapters");

        function render() {
            renderSidebar();
            if (state.currentView === "dashboard") renderDashboard();
            else renderChapter();
        }

        function renderSidebar() {
            sidebarChapters.innerHTML = courseData.map(ch => {
                const isActive = state.currentChapterId === ch.id && state.currentView === "chapter";
                return `
                    <button class="nav-chapter ${isActive ? 'active' : ''}" onclick="openChapter('${ch.id}')">
                        <span class="nav-num">${ch.number}</span>
                        <span class="nav-text">
                            <span class="nav-title">${ch.title}</span>
                            <span class="nav-progress">${ch.sections.length === 0 ? 'قيد الإضافة' : calcPercent(ch) + '%'}</span>
                        </span>
                    </button>
                `;
            }).join("");
        }

            let started = 0;
            let totalPct = 0;

            const overallPct = Math.round(totalPct / totalChapters) || 0;

            mainContent.innerHTML = `
                <div class="card" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">

                <div class="chapter-grid">

                        const isDone = getProgress(ch.id).finalScore !== null;
                        const statusClass = isDone ? 'badge-done' : (pct > 0 ? 'badge-progress' : 'badge-idle');
                        const statusText = isDone ? 'مكتمل' : (pct > 0 ? 'قيد المذاكرة' : 'لم يبدأ');
                        return `
                            <div class="card chapter-card" onclick="openChapter('${ch.id}')">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                                    <span class="nav-num">${ch.number}</span>
                                    <span class="badge ${statusClass}">${statusText}</span>
                                </div>
                                <h3>${ch.title}</h3>
                                <p>${ch.description}</p>
                                <div style="background: var(--surface-2); border-radius: 10px; height: 8px; overflow: hidden; margin-top: 1rem;">
                                    <div style="height: 100%; background: var(--green); width: ${pct}%;"></div>
                                </div>
                            </div>
                        `;
                    }).join("")}
                </div>
            `;
        }

        function renderChapter() {
            const chapter = courseData.find(c => c.id === state.currentChapterId);
            if (!chapter) return goHome();

            if (chapter.sections.length === 0) {
                mainContent.innerHTML = `
                    <button class="btn btn-ghost" onclick="goHome()" style="margin-bottom: 1rem;">← كل الفصول</button>
                    <div class="card" style="text-align: center; padding: 3rem;">
                        <h2>${chapter.title}</h2>
                        <p style="color: var(--muted); margin-top: 1rem;">هذا الفصل جاهز في الهيكل، ولكن محتواه لم يُضف بعد (يمكنك إضافته في الكود).</p>
                    </div>
                `;
                return;
            }

            mainContent.innerHTML = `
                <button class="btn btn-ghost" onclick="goHome()" style="margin-bottom: 1rem;">← كل الفصول</button>
                <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <span style="color: var(--muted); font-size: 0.9rem;">Chapter ${chapter.number}</span>
                        <h1 style="color: var(--navy);">${chapter.title}</h1>
                    </div>
                    <div style="font-size: 1.5rem; font-weight: bold; color: var(--green);">${calcPercent(chapter)}%</div>
                </div>

                <div class="stepper">
                    <button class="step ${state.currentStage === 'study' ? 'active' : ''}" onclick="changeStage('study')">Study</button>
                    <button class="step ${state.currentStage === 'flashcards' ? 'active' : ''}" onclick="changeStage('flashcards')">Flashcards</button>
                    <button class="step ${state.currentStage === 'summary' ? 'active' : ''}" onclick="changeStage('summary')">Summary</button>
                    <button class="step ${state.currentStage === 'quiz' ? 'active' : ''}" onclick="changeStage('quiz')">Final Quiz</button>
                </div>
                <div id="stageContent"></div>
            `;

            if (state.currentStage === 'study') renderStudy(chapter);
            else if (state.currentStage === 'flashcards') renderFlashcards(chapter);
            else if (state.currentStage === 'summary') renderSummary(chapter);
            else if (state.currentStage === 'quiz') renderQuiz(chapter);
        }

        // =========================================================================
        // 4. المراحل (Stages)
        // =========================================================================
        function renderStudy(chapter) {
            const p = getProgress(chapter.id);
            const section = chapter.sections[state.currentSectionIndex];
            const isQuizDone = p.studiedSections.includes(section.id);

            document.getElementById("stageContent").innerHTML = `
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <h2 style="color: var(--navy);">${section.title}</h2>
                        <span class="badge ${isQuizDone ? 'badge-done' : 'badge-idle'}">${isQuizDone ? 'تم' : 'قيد القراءة'}</span>
                    </div>

                    <div class="content-grid">
                        <div class="card" style="background: var(--surface-2);">
                            <h3>English</h3>
                            ${section.english.map(p => `<p class="english-text">${p}</p>`).join("")}
                        </div>
                        <div class="card" style="background: var(--surface-2);">
                            <h3>الترجمة</h3>
                            ${section.arabic.map(p => `<p class="arabic-text">${p}</p>`).join("")}
                        </div>
                    </div>

                    <div class="card" style="background: var(--surface-2); margin-bottom: 1.5rem;">
                        <h3>الشرح</h3>
                        <ul>${section.explanation.map(i => `<li>${i}</li>`).join("")}</ul>
                    </div>

                    <div class="content-grid">
                        <div class="card" style="background: var(--surface-2);">
                            <h3>المصطلحات</h3>
                            <ul class="term-list">${section.terms.map(t => `<li><strong>${t.en}:</strong> ${t.ar}</li>`).join("")}</ul>
                        </div>
                    </div>

                    <div style="text-align: center; margin-top: 2rem;">
                        <button class="btn btn-primary" onclick="markSectionDone('${section.id}')">
                            ${isQuizDone ? 'الجزء التالي' : 'تمت القراءة، الجزء التالي'}
                        </button>
                    </div>
                </div>
            `;
        }

        window.markSectionDone = (sectionId) => {
            const ch = courseData.find(c => c.id === state.currentChapterId);
            const p = getProgress(ch.id);
            if (!p.studiedSections.includes(sectionId)) {
                p.studiedSections.push(sectionId);
            }
            saveState();
            if (state.currentSectionIndex < ch.sections.length - 1) {
                state.currentSectionIndex++;
                renderChapter();
            } else {
                state.currentStage = 'flashcards';
                renderChapter();
            }
        };

        function renderFlashcards(chapter) {
            let idx = 0;
            const p = getProgress(chapter.id);

            function draw() {
                const card = chapter.flashcards[idx];
                const isKnown = p.flashcardsKnown.includes(card.id);
                document.getElementById("stageContent").innerHTML = `
                    <div class="card">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                            <span>بطاقة ${idx + 1} / ${chapter.flashcards.length}</span>
                            <span style="color: var(--green);">تم حفظ ${p.flashcardsKnown.length}</span>
                        </div>
                        <div class="flashcard-container">
                            <div class="flashcard ${isKnown ? 'revealed' : ''}" onclick="this.classList.toggle('revealed')">
                                <h3>${card.front}</h3>
                                <div class="answer">${card.back}</div>
                            </div>
                        </div>
                        <p style="text-align: center; margin-bottom: 1rem;">اضغط على البطاقة لكشف الإجابة</p>
                        <div style="display: flex; justify-content: center; gap: 1rem;">
                            <button class="btn btn-success" onclick="markCard('${card.id}', true)">أعرفها</button>
                            <button class="btn btn-danger" onclick="markCard('${card.id}', false)">أحتاج مراجعة</button>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-top: 2rem;">
                            <button class="btn btn-ghost" ${idx === 0 ? 'disabled' : ''} onclick="prevCard()">السابق</button>
                            <button class="btn btn-primary" ${idx === chapter.flashcards.length - 1 ? 'disabled' : ''} onclick="nextCard()">التالي</button>
                        </div>
                    </div>
                `;
            }

            window.nextCard = () => { if (idx < chapter.flashcards.length - 1) { idx++; draw(); } };
            window.prevCard = () => { if (idx > 0) { idx--; draw(); } };
            window.markCard = (id, known) => {
                if (known && !p.flashcardsKnown.includes(id)) p.flashcardsKnown.push(id);
                if (!known) p.flashcardsKnown = p.flashcardsKnown.filter(x => x !== id);
                saveState();
                renderSidebar();
                if (idx < chapter.flashcards.length - 1) { idx++; draw(); } else { draw(); }
            };
            draw();
        }

        function renderSummary(chapter) {
            document.getElementById("stageContent").innerHTML = `
                <div class="card">
                    <h2 style="color: var(--navy); margin-bottom: 1.5rem;">ملخص الفصل (20 نقطة)</h2>
                    <ul style="line-height: 2; padding-right: 1.5rem;">
                        ${chapter.summary.map(s => `<li>${s}</li>`).join("")}
                    </ul>
                    <div style="text-align: center; margin-top: 2rem;">
                        <button class="btn btn-primary" onclick="changeStage('quiz')">الانتقال للاختبار النهائي</button>
                    </div>
                </div>
            `;
        }

        function renderQuiz(chapter) {
            const p = getProgress(chapter.id);
            if (p.finalScore !== null) {
                document.getElementById("stageContent").innerHTML = `
                    <div class="card" style="text-align: center;">
                        <h2>النتيجة النهائية</h2>
                        <div style="font-size: 3rem; color: var(--green); font-weight: bold; margin: 1rem 0;">${p.finalScore}%</div>
                        <button class="btn btn-ghost" onclick="resetQuiz()">إعادة الاختبار</button>
                    </div>
                `;
                return;
            }

            let html = `<div class="card"><h2 style="margin-bottom: 1.5rem;">الاختبار الشامل (60 سؤال)</h2>`;
            chapter.quiz.forEach((q, i) => {
                html += `
                    <div class="question-box" id="qb-${q.id}">
                        <span class="q-title">${i + 1}. ${q.question}</span>
                        <div class="options-list">
                            ${q.options.map((opt, optIdx) => `
                                <label class="option-label" id="opt-${q.id}-${optIdx}" onclick="selectOpt('${q.id}', ${optIdx})">
                                    <input type="radio" name="q-${q.id}" value="${optIdx}">
                                    <span>${opt}</span>
                                </label>
                            `).join("")}
                        </div>
                    </div>
                `;
            });
            html += `<button class="btn btn-primary" style="width: 100%;" onclick="submitQuiz()">تسليم الاختبار</button></div>`;
            document.getElementById("stageContent").innerHTML = html;
        }

        let answers = {};
        window.selectOpt = (qId, opt) => {
            answers[qId] = opt;
            document.querySelectorAll(`[id^="opt-${qId}-"]`).forEach(el => el.classList.remove('selected'));
            document.getElementById(`opt-${qId}-${opt}`).classList.add('selected');
        };

        window.submitQuiz = () => {
            const ch = courseData.find(c => c.id === state.currentChapterId);
            let score = 0;
            ch.quiz.forEach(q => {
                const box = document.getElementById(`qb-${q.id}`);
                const isCorrect = answers[q.id] === q.answer;
                if (isCorrect) score++;
                box.classList.add(isCorrect ? 'correct' : 'wrong');
            });
            const p = getProgress(ch.id);
            p.finalScore = Math.round((score / ch.quiz.length) * 100);
            saveState();
            renderChapter();
            renderSidebar();
        };

        window.resetQuiz = () => {
            const p = getProgress(state.currentChapterId);
            p.finalScore = null;
            answers = {};
            saveState();
            renderChapter();
        };

        // =========================================================================
        // 5. التنقل (Navigation)
        // =========================================================================
        window.goHome = () => { state.currentView = "dashboard"; state.currentChapterId = null; saveState(); render(); if(window.innerWidth <= 768) toggleSidebar(); };
        window.openChapter = (id) => { state.currentChapterId = id; state.currentView = "chapter"; state.currentStage = "study"; state.currentSectionIndex = 0; answers = {}; saveState(); render(); if(window.innerWidth <= 768) toggleSidebar(); };
        window.changeStage = (stage) => { state.currentStage = stage; saveState(); renderChapter(); };
        window.toggleSidebar = () => { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('open'); };
        window.toggleTheme = () => { state.theme = state.theme === 'light' ? 'dark' : 'light'; document.documentElement.setAttribute("data-theme", state.theme); document.querySelector('.theme-btn').innerText = state.theme === 'light' ? '🌙' : '☀️'; saveState(); };

        // =========================================================================
        // 6. التهيئة
        // =========================================================================
        loadState();
        render();
    </script>
</body>
</html>
